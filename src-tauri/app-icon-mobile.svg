<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Full-bleed variant for iOS and Android, which apply their own corner
    masks: the ground runs to the edges and the mark is a little larger.
    Same mark as app-icon.svg. Regenerate with `pnpm icons`.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1727"/>
      <stop offset="1" stop-color="#110C18"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#ground)"/>
  <g transform="translate(512 512) scale(1.14) translate(-512 -512)">
    <circle cx="471" cy="473" r="221" fill="#FF333A"/>
    <rect x="493" y="491" width="281" height="281" rx="60" fill="#A9DE54" stroke="#16101E" stroke-width="16" paint-order="stroke"/>
  </g>
</svg>
