[package]
name = "devhub"
version = "0.1.0"
description = "Agentic console for herdr-hosted coding agents"
authors = ["Nieky Allen <nieky.allen@gmail.com>"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Release builds ship without an inspector; opt in with
# `pnpm tauri build --features devtools` to debug a packaged app.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables child webviews (browser panes) and Manager::get_webview
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-notification = "2"
keyring = { version = "4.1.5", features = [
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }

# keyring's v1 API sets no default store on iOS (and its Apple backend
# only builds there with `protected`), so iOS registers the
# data-protection keychain store itself; see keychain::entry.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }
keyring-core = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
